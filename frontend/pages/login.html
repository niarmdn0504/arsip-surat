<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" id="favicon" href="data:">
  <title>Login — Arsip Surat Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 40%, #0e7490 100%);
    }
    .glass-card {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
    }
    .input-field {
      width: 100%;
      padding: 11px 14px 11px 42px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all 0.15s;
      color: #0f172a;
    }
    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1e40af, #1d4ed8);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, #1e3a8a, #1e40af);
      box-shadow: 0 6px 20px rgba(30,64,175,0.4);
      transform: translateY(-1px);
    }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg) } }
    .pattern {
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.08) 1px, transparent 0);
      background-size: 28px 28px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(-3deg) }
      50% { transform: translateY(-12px) rotate(-3deg) }
    }
    .float-card { animation: float 4s ease-in-out infinite; }
    .float-card-2 { animation: float 5s ease-in-out 1s infinite; }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fade-up 0.5s ease both; }
  </style>
</head>
<body class="min-h-screen gradient-bg pattern flex items-center justify-center p-4">

  <!-- Background decorasi -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="float-card absolute top-[15%] left-[8%] bg-white/10 rounded-2xl p-4 text-white/80 text-xs hidden lg:block">
      <div class="text-lg mb-1">📨</div>
      <div class="font-semibold">Surat Masuk</div>
      <div class="text-white/60">Dikelola rapi</div>
    </div>
    <div class="float-card-2 absolute bottom-[20%] right-[8%] bg-white/10 rounded-2xl p-4 text-white/80 text-xs hidden lg:block">
      <div class="text-lg mb-1">📤</div>
      <div class="font-semibold">Surat Keluar</div>
      <div class="text-white/60">Terarsip aman</div>
    </div>
    <div class="absolute top-1/4 right-1/4 w-64 h-64 bg-cyan-500/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 left-1/4 w-64 h-64 bg-blue-400/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Login Card -->
  <div class="glass-card rounded-3xl shadow-2xl w-full max-w-md p-8 relative z-10 animate-fade-up">

    <!-- Logo & Branding Sekolah -->
    <div class="text-center mb-8">
      <div id="login-logo" class="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30" style="font-size:36px">
        🏫
      </div>
      <h1 class="text-xl font-extrabold text-gray-900 leading-tight" id="login-nama-sekolah">SMA Negeri 1 Contoh</h1>
      <p class="text-gray-500 text-sm mt-1" id="login-tagline">Sistem Arsip Surat Digital</p>
    </div>

    <!-- Alert Error -->
    <div id="alert-error" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
      <span>❌</span>
      <span id="alert-msg">Email atau password salah.</span>
    </div>

    <!-- Form -->
    <form id="login-form" novalidate>
      <!-- Email -->
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Email</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" id="email" class="input-field" placeholder="admin@sekolah.sch.id" autocomplete="email" required>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" class="input-field" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="btn-login" class="btn-login">
        <span id="btn-text">Masuk</span>
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6" id="footer-copy">
      © 2024 Arsip Surat Sekolah · Powered by Supabase
    </p>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/branding.js"></script>
  <script>
    redirectIfLoggedIn();

    // Toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', () => {
      const pw = document.getElementById('password');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });

    // Login form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const btnText = document.getElementById('btn-text');
      const alertEl = document.getElementById('alert-error');
      const alertMsg = document.getElementById('alert-msg');

      if (!email || !password) {
        alertMsg.textContent = 'Email dan password wajib diisi.';
        alertEl.classList.remove('hidden');
        return;
      }

      // Loading state
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Memproses...';
      alertEl.classList.add('hidden');

      const result = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });

      btn.disabled = false;
      btnText.textContent = 'Masuk';

      if (result?.ok && result.data?.token) {
        localStorage.setItem('token', result.data.token);
        localStorage.setItem('user', JSON.stringify(result.data.user));
        window.location.href = '/pages/dashboard.html';
      } else {
        alertMsg.textContent = result?.data?.error || 'Email atau password salah.';
        alertEl.classList.remove('hidden');
        document.getElementById('password').value = '';
      }
    });

    // Enter key
    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('login-form').dispatchEvent(new Event('submit'));
    });
  </script>
</body>
</html>
